    <title>Document</title>
    <style>
      * {
        margin: 0;
      }
      body {
        display: grid;
        place-content: center;
        width: 100svw;
        height: 100svh;
      }
      main {
        display: grid;
        width: 100%;
        grid-template-columns: 1fr 1fr 1fr 1fr;
      }
      main img {
        width: 100%;
        height: auto;
      }
      main h1 {
        text-align: center;
        font-size: 4rem;
      }
    </style>
  </head>

      <img src="./2d_rotate_rotate_z.gif" />
